<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân - Nhập thông tin sinh viên</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 15px;
            padding: 0;
            color: #000;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 5px;
        }
        .user-tag {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #444;
        }
        input {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 0.9rem;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 3px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn-submit:hover { opacity: 0.9; }
        .nav-links {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
        }
        .nav-links a {
            color: #3498db;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Thông tin Người thuê trọ cá nhân</h2>
        <div class="user-tag">Tài khoản liên kết: <b>{{ session.username }}</b></div>

        <form method="POST">
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" name="StudentName" value="{{ student.StudentName if student else '' }}" required>
            </div>
            <div class="form-group">
                <label>Giới tính:</label>
                <input type="text" name="Gender" value="{{ student.Gender if student else '' }}" required>
            </div>
            <div class="form-group">
                <label>Ngày sinh (YYYY-MM-DD):</label>
                <input type="text" name="StudentBirth" value="{{ student.StudentBirth if student else '' }}" required>
            </div>
            <div class="form-group">
                <label>Quê quán:</label>
                <input type="text" name="StudentHomeTown" value="{{ student.StudentHomeTown if student else '' }}" required>
            </div>
            <div class="form-group">
                <label>Khóa học:</label>
                <input type="text" name="StudentAcademicYear" value="{{ student.StudentAcademicYear if student else '' }}" required>
            </div>
            <div class="form-group">
                <label>Số phòng:</label>
                <input type="text" name="StudentRoomNumber" value="{{ student.StudentRoomNumber if student else '' }}" required>
            </div>
            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" name="PhoneNumber" value="{{ student.PhoneNumber if student else '' }}" required>
            </div>
            <div class="form-group">
                <label>Ngày vào trọ (YYYY-MM-DD):</label>
                <input type="text" name="CheckInDate" value="{{ student.CheckInDate if student else '' }}" required>
            </div>
            
            <button type="submit" class="btn-submit">Lưu thông tin & Đồng bộ lên bảng chung</button>
        </form>

        <div class="nav-links">
            <a href="/">&larr; Quay lại Trang chủ</a> | <a href="/logout" style="color: #e74c3c;">Đăng xuất</a>
        </div>
    </div>
</body>
</html>
